# Local stack: MariaDB, Redis, single-node Kafka (KRaft), the billing API and its workers.
# Production-like settings (APP_ENV=production, cached config, Redis-backed queues,
# cache and rate limits); only the credentials below are demo values.
#
#   docker compose up --build
#   curl http://localhost:8080/api/health/ready
#
# APP_KEY is read from your local .env (created by `php artisan key:generate`).

x-app: &app
  build: .
  image: subscription-billing-api:local
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env (php artisan key:generate)}
    APP_URL: http://localhost:8080
    DB_CONNECTION: mariadb
    DB_HOST: mariadb
    DB_PORT: 3306
    DB_DATABASE: billing
    DB_USERNAME: billing
    DB_PASSWORD: billing
    # Shared by every instance: rate-limit counters, scheduler locks, queues.
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    SESSION_DRIVER: array
    # Local-only demo keys (see .env.example): local-dev-key has every scope,
    # dunning-local-key only what the dunning service needs, prometheus-local-key ops.read.
    BILLING_API_CLIENTS: >-
      [{"name":"local-dev","key_sha256":"ed5a18fb8f807f996d649e379d3f35f39c543a91bdbf88c492f2ebd10d4df86c","scopes":["*"]},
      {"name":"dunning-service","key_sha256":"4b80b5560645b6733df92f41a008cf4462ed86185c6700db609ba1e7675a91a0","scopes":["billing.read","payments.write","invoices.write","subscriptions.write"]},
      {"name":"prometheus","key_sha256":"ccdbae7394b6ab58177effcc5b42bb12219b099da90691424ad5d571b4224a4d","scopes":["ops.read"]}]
    BILLING_WEBHOOK_SECRET: whsec_local_dev
    BILLING_EVENTS_DRIVER: kafka
    KAFKA_BROKERS: kafka:9092
    BILLING_EVENTS_TOPIC: billing.events
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: billing
      MARIADB_USER: billing
      MARIADB_PASSWORD: billing
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic billing.events --partitions 3 --replication-factor 1

  migrate:
    build: .
    image: subscription-billing-api:local
    user: www-data
    environment: *app-env
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["php", "artisan", "migrate", "--force"]

  api:
    <<: *app
    ports:
      - "8080:80"

  # Scale with: docker compose up --scale worker=4
  worker:
    <<: *app
    user: www-data
    command: ["php", "artisan", "queue:work", "--queue=billing,default", "--sleep=1", "--max-time=3600"]

  # Keep a single relay: it publishes in commit order (see ADR 0004).
  relay:
    <<: *app
    user: www-data
    command: ["php", "artisan", "outbox:relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    user: www-data
    command: ["php", "artisan", "schedule:work"]

networks:
  default:
    # Fixed name so the dunning service's compose file can join this network.
    name: billing-net
