# Local stack: MariaDB + single-node Kafka (KRaft) + the billing API and its workers.
#
#   docker compose up --build
#   curl http://localhost:8080/api/health/ready
#
# APP_KEY is read from your local .env (created by `php artisan key:generate`).

x-app: &app
  build: .
  image: subscription-billing-api:local
  environment: &app-env
    APP_ENV: local
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env (php artisan key:generate)}
    APP_URL: http://localhost:8080
    DB_CONNECTION: mariadb
    DB_HOST: mariadb
    DB_PORT: 3306
    DB_DATABASE: billing
    DB_USERNAME: billing
    DB_PASSWORD: billing
    CACHE_STORE: database
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
    BILLING_API_KEYS: local-dev-key
    BILLING_WEBHOOK_SECRET: whsec_local_dev
    BILLING_EVENTS_DRIVER: kafka
    KAFKA_BROKERS: kafka:9092
    BILLING_EVENTS_TOPIC: billing.events
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: billing
      MARIADB_USER: billing
      MARIADB_PASSWORD: billing
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic billing.events --partitions 3 --replication-factor 1

  migrate:
    build: .
    image: subscription-billing-api:local
    environment: *app-env
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["php", "artisan", "migrate", "--force"]

  api:
    <<: *app
    ports:
      - "8080:80"

  relay:
    <<: *app
    command: ["php", "artisan", "outbox:relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

networks:
  default:
    # Fixed name so the dunning service's compose file can join this network.
    name: billing-net
