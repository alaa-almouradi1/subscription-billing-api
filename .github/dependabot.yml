# Weekly dependency update PRs; each one runs the full CI before it can be merged.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ["laravel/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The php version is a deliberate upgrade, not a bot bump: it must
      # move together with the version CI tests on (.github/workflows/ci.yml and composer.json's platform pin).
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
